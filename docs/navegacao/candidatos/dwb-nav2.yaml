# Nav2 Jazzy 1.3.13: limites virtuais, não calibração do robô físico.
# Fontes: ros-navigation/navigation2 tag 1.3.13; plugins XML e headers instalados.
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.10
      use_astar: false
      allow_unknown: false

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 0.2
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    error_code_names: [compute_path_error_code, follow_path_error_code, spin_error_code]
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    # Jazzy acrescenta BT_BUILTIN_PLUGINS automaticamente; não duplicar libs.
    # O launch deve fornecer default_nav_to_pose_bt_xml absoluto para ir_para.xml.

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    cycle_frequency: 10.0
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    behavior_plugins: [spin, wait]
    spin:
      plugin: nav2_behaviors::Spin
    wait:
      plugin: nav2_behaviors::Wait
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.2

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    controller_frequency: 10.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.0001
    min_y_velocity_threshold: 0.0001
    min_theta_velocity_threshold: 0.0001
    failure_tolerance: 0.0
    costmap_update_timeout: 0.3
    publish_zero_velocity: true
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      # DWA: amostrar somente velocidades alcançáveis em um tick de 10 Hz.
      # StandardTrajectoryGenerator usaria sim_time (1.7 s) para esse limite.
      trajectory_generator_name: dwb_plugins::LimitedAccelGenerator
      sim_period: 0.1
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.16
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.16
      min_speed_theta: 0.0
      acc_lim_x: 0.35
      acc_lim_y: 0.0
      acc_lim_theta: 1.2
      decel_lim_x: -0.35
      decel_lim_y: 0.0
      decel_lim_theta: -1.2
      vx_samples: 16
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 1.7
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.10
      # O padrão 0.25 seria maior que nossa velocidade máxima inteira.
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      # Os críticos de alinhamento por célula criaram mínimo parado na escala
      # deste robô. Progresso recebe peso maior sem remover colisão/rotação.
      critics: [RotateToGoal, Oscillation, BaseObstacle, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      PathDist.scale: 16.0
      GoalDist.scale: 32.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# A margem de 0.02 m já está no raio arredondado; não inflar padding outra vez.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.18
      footprint_padding: 0.0
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: false
      track_unknown_space: true
      transform_tolerance: 0.2
      initial_transform_timeout: 0.3
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: laser
        laser:
          topic: /scan
          sensor_frame: laser_simulado
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          observation_persistence: 0.0
          # Segundos tolerados entre observações, não frequência em Hz.
          expected_update_rate: 0.5
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.18
      footprint_padding: 0.0
      resolution: 0.05
      width: 4
      height: 4
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      track_unknown_space: true
      transform_tolerance: 0.2
      initial_transform_timeout: 0.3
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: laser
        laser:
          topic: /scan
          sensor_frame: laser_simulado
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.5
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 3.0
